<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>垫资期初余额原型</title>
<style>
:root {
  --blue: #1677ff;
  --blue-h: #4096ff;
  --bg: #f5f6f8;
  --line: #f0f0f0;
  --text: #1f1f1f;
  --muted: #8c8c8c;
  --danger: #ff4d4f;
  --green: #389e0d;
  --orange: #d46b08;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  color: var(--text);
  background: var(--bg);
  font-size: 13px;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.app { display: flex; height: 100%; min-width: 0; }
.rail {
  width: 72px; background: #001529; color: rgba(255,255,255,.75);
  display: flex; flex-direction: column; align-items: center; padding: 8px 0; flex: none; gap: 4px;
}
.rail .logo {
  width: 28px; height: 28px; border-radius: 7px; background: var(--blue);
  color: #fff; display: grid; place-items: center; font-weight: 700; margin: 4px 0 10px; font-size: 13px;
}
.rail button {
  width: 64px; border: 0; background: transparent; color: rgba(255,255,255,.65);
  border-radius: 6px; padding: 8px 0; line-height: 1.15;
}
.rail button b { display: block; font-size: 12px; font-weight: 600; }
.rail button span { display: block; font-size: 10px; margin-top: 2px; }
.rail button.active { background: var(--blue); color: #fff; }
.sider {
  width: 196px; background: #fff; border-right: 1px solid var(--line); flex: none;
  overflow: auto; padding: 8px 0 16px;
}
.sider h4 { margin: 14px 16px 6px; font-size: 12px; color: #8c8c8c; font-weight: 500; }
.sider button.item {
  display: block; width: calc(100% - 16px); margin: 0 8px; padding: 8px 10px 8px 16px;
  border: 0; border-radius: 6px; background: transparent; color: #434343; text-align: left; line-height: 20px;
}
.sider button.item.active { background: #e6f4ff; color: var(--blue); font-weight: 500; }
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.top {
  height: 46px; background: #fff; border-bottom: 1px solid var(--line);
  display: flex; align-items: center; padding: 0 16px; gap: 12px; flex: none;
}
.crumb { color: #8c8c8c; white-space: nowrap; }
.crumb b { color: var(--text); font-weight: 500; }
.top .spacer { flex: 1; }
.who { color: #595959; font-size: 12px; white-space: nowrap; }
.content { padding: 12px 16px 20px; overflow: auto; flex: 1; min-width: 0; }
.panel { background: #fff; border-radius: 8px; padding: 16px; }
.panel + .panel { margin-top: 12px; }
.filters { display: grid; grid-template-columns: repeat(4, minmax(160px, 1fr)); gap: 12px 16px; }
.field label { display: block; margin-bottom: 6px; color: #595959; line-height: 20px; }
.field input, .field select, .field textarea {
  width: 100%; height: 32px; border: 1px solid #d9d9d9; border-radius: 6px;
  padding: 0 10px; background: #fff; outline: none;
}
.field textarea { height: 64px; padding: 6px 10px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 2px rgba(22,119,255,.12); }
.field input[readonly] { background: #fafafa; color: #595959; }
.actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
.filters .actions { grid-column: 1 / -1; margin: 0; align-items: end; }
.btn {
  height: 32px; border: 1px solid #d9d9d9; background: #fff; border-radius: 6px;
  padding: 0 15px; line-height: 30px;
}
.btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
.btn.primary:hover { background: var(--blue-h); }
.btn.link { height: 22px; border: 0; background: transparent; color: var(--blue); padding: 0 4px; line-height: 22px; }
.btn.link.danger { color: var(--danger); }
.btn.tiny { height: 24px; line-height: 22px; padding: 0 8px; font-size: 12px; }
.toolbar { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 12px; }
.table-wrap { overflow: auto; max-height: calc(100vh - 250px); }
table { width: 100%; border-collapse: separate; border-spacing: 0; }
th, td {
  padding: 9px 12px; border-bottom: 1px solid var(--line); text-align: left;
  vertical-align: middle; white-space: nowrap; line-height: 20px;
}
th { background: #fafafa; font-weight: 500; color: #595959; position: sticky; top: 0; z-index: 1; }
tr.hit td { background: #f6ffed; }
tr:hover td { background: #fafafa; }
tr.hit:hover td { background: #f6ffed; }
td.empty, tr.empty td { text-align: center; color: #8c8c8c; padding: 42px 12px; }
.num { font-variant-numeric: tabular-nums; }
.minus { color: var(--danger); }
.plus { color: var(--green); }
.tag {
  display: inline-block; padding: 0 8px; border-radius: 4px; line-height: 20px; font-size: 12px;
  background: #fafafa; color: #595959; border: 1px solid #d9d9d9;
}
.tag.blue { background: #e6f4ff; color: var(--blue); border-color: #91caff; }
.tag.green { background: #f6ffed; color: var(--green); border-color: #b7eb8f; }
.tag.orange { background: #fff7e6; color: var(--orange); border-color: #ffd591; }
.tag.purple { background: #f9f0ff; color: #722ed1; border-color: #d3adf7; }
.tag.red { background: #fff2f0; color: var(--danger); border-color: #ffccc7; }
.alert {
  background: #e6f4ff; border: 1px solid #91caff; color: #0958d9;
  border-radius: 8px; padding: 10px 12px; line-height: 22px; margin-bottom: 12px;
}
.alert b { font-weight: 600; }
.tabs { display: flex; gap: 0; border-bottom: 1px solid var(--line); margin: -4px 0 12px; }
.tabs button {
  border: 0; border-bottom: 2px solid transparent; background: transparent;
  padding: 10px 16px; margin-bottom: -1px; color: #595959;
}
.tabs button.on { color: var(--blue); border-bottom-color: var(--blue); font-weight: 600; }
.note { color: #595959; line-height: 22px; }
.note h3 { margin: 0 0 8px; font-size: 14px; color: var(--text); }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 24px; }
.cols p { margin: 0; }
.popover {
  position: absolute; right: 16px; top: 42px; z-index: 5; width: 220px;
  background: #fff; border: 1px solid #f0f0f0; border-radius: 8px;
  box-shadow: 0 6px 16px rgba(0,0,0,.12); padding: 8px 12px;
}
.popover label { display: flex; align-items: center; gap: 8px; height: 28px; }
.mask {
  position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex;
  align-items: flex-start; justify-content: center; padding: 32px 16px; z-index: 20; overflow: auto;
}
.modal { width: 840px; background: #fff; border-radius: 8px; box-shadow: 0 8px 28px rgba(0,0,0,.18); }
.modal.narrow { width: 520px; }
.modal h3 {
  margin: 0; height: 52px; padding: 0 16px 0 20px; border-bottom: 1px solid var(--line);
  display: flex; justify-content: space-between; align-items: center; font-size: 16px; font-weight: 600;
}
.modal h3 button { border: 0; background: transparent; font-size: 18px; color: #8c8c8c; width: 32px; height: 32px; }
.modal .body { padding: 16px 20px 4px; }
.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.card { background: #fafafa; border: 1px solid #f0f0f0; border-radius: 8px; padding: 12px; }
.card h4 { margin: 0 0 10px; font-size: 13px; }
.req::before { content: "*"; color: var(--danger); margin-right: 4px; }
.err { color: var(--danger); min-height: 18px; line-height: 18px; margin: 6px 0; }
.fx {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; margin-top: 12px;
  background: #fff; border: 1px dashed #d9d9d9; border-radius: 8px; padding: 12px;
}
.fx span { color: #8c8c8c; display: block; margin-bottom: 4px; }
.footer { display: flex; justify-content: flex-end; gap: 8px; padding: 8px 20px 16px; }
.toast {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  background: #fff; border-radius: 8px; box-shadow: 0 6px 16px rgba(0,0,0,.12);
  padding: 10px 16px; z-index: 40; display: none; line-height: 22px; max-width: min(640px, calc(100% - 32px));
}
.toast.show { display: block; }
.kv { display: grid; grid-template-columns: 120px 1fr; gap: 6px 8px; line-height: 22px; }
.kv i { color: #8c8c8c; font-style: normal; }
@media (max-width: 1100px) {
  .filters, .cards, .cols, .fx { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 760px) {
  .sider { display: none; }
  .filters, .cards, .cols, .fx { grid-template-columns: 1fr; }
}
</style>
</head>

function round2(n) {
  const v = Number(n);
  if (!isFinite(v)) return 0;
  return Math.round((v + Number.EPSILON) * 100) / 100;
}
function cents(n) { return Math.round(round2(n) * 100); }
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function money(n) {
  const v = round2(n);
  return v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function moneyHtml(n, signed) {
  const v = round2(n);
  const cls = v < 0 ? "minus" : (signed && v > 0 ? "plus" : "");
  return `<span class="num ${cls}">${esc(money(v))}</span>`;
}
function moneyCcy(n, ccy) {
  return `<span class="num">${esc(ccy)} ${moneyHtml(n)}</span>`;
}
function nowText() {
  const d = new Date();
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
function bizTag(biz) {

}
function toast(text) {
  const el = document.getElementById("toast");
  el.textContent = text;
  el.className = "toast show";

  toast._t = setTimeout(() => { el.className = "toast"; }, 3200);

let db = seed();

function page() {
  const id = (location.hash || "#fund-merchants").slice(1);
  return PAGES[id] ? id : "fund-merchants";
}
function accountById(id) { return db.accounts.find((a) => a.accountId === id); }
function nextNo(prefix) {
  db.seq += 1;
  return prefix + String(db.seq).padStart(4, "0");
}
function optionAccounts(selected) {
  return db.accounts.map((a) => {
    const label = `${a.name} / ${a.biz} / ${a.currency} / 余额 ${money(a.real)}`;
    return `<option value="${esc(a.accountId)}" ${a.accountId === selected ? "selected" : ""}>${esc(label)}</option>`;
  }).join("");
}
function advanceAccounts(selected) {
  return db.accounts.filter((a) => a.biz === "垫资").map((a) => {
    const label = `${a.name} / ${a.biz} / ${a.currency} / 余额 ${money(a.real)}`;
    return `<option value="${esc(a.accountId)}" ${a.accountId === selected ? "selected" : ""}>${esc(label)}</option>`;
  }).join("");
}

function render() {
  const id = page();
  const meta = PAGES[id];
  document.title = meta.title + " · 垫资原型";
  document.getElementById("rail-fund").classList.toggle("active", meta.sys === "fund");
  document.getElementById("rail-recon").classList.toggle("active", meta.sys === "recon");
  document.getElementById("crumb").innerHTML = meta.crumb;
  const fundItem = (pid, label) => `<button type="button" class="item ${id === pid ? "active" : ""}" data-go="${pid}">${label}</button>`;
  document.getElementById("sider").innerHTML = meta.sys === "fund"
    ? `<h4>商户管理</h4>${fundItem("fund-merchants", "商户管理")}${fundItem("fund-transfers", "账户调拨列表")}<h4>交易管理</h4>${fundItem("fund-txns", "交易详情")}`
    : `<h4>垫资对账</h4>${fundItem("recon-receipts", "平台收款明细")}${fundItem("recon-balance", "余额表")}<h4>说明</h4><p class="note" style="padding:0 16px">余额表在本系统，不在 Fund。</p>`;
  const content = document.getElementById("content");
  if (id === "fund-merchants") content.innerHTML = viewMerchants();
  else if (id === "fund-transfers") content.innerHTML = viewTransfers();
  else if (id === "fund-txns") content.innerHTML = viewTxns();
  else if (id === "recon-receipts") content.innerHTML = viewReceipts();
  else content.innerHTML = viewBalance();
  const hit = document.querySelector("tr.hit");
  if (hit) hit.scrollIntoView({ block: "nearest" });
}

function qval(group, key) { return db.queries[group][key] || ""; }
function field(label, html) { return `<div class="field"><label>${label}</label>${html}</div>`; }
function textInput(id, value, placeholder) {
  return `<input id="${id}" value="${esc(value)}" placeholder="${esc(placeholder || "")}" />`;
}
function selectInput(id, value, options) {
  const opts = [`<option value="">${esc(options.placeholder || "全部")}</option>`]
    .concat(options.items.map((item) => `<option value="${esc(item)}" ${item === value ? "selected" : ""}>${esc(item)}</option>`));
  return `<select id="${id}">${opts.join("")}</select>`;
}

function viewTxns() {
  const q = db.queries.txns;
  const visible = TX_COLS.filter(([key]) => !db.txHidden[key]);
  let rows = db.txns.filter((t) => {
    if (q.merchantId && !t.merchantId.includes(q.merchantId.trim())) return false;
    if (q.merchantName && !t.merchantName.includes(q.merchantName.trim())) return false;
    if (q.uniqueId && !String(t.uniqueId).includes(q.uniqueId.trim())) return false;
    if (q.flowNo && !t.flowNo.includes(q.flowNo.trim())) return false;
    if (q.txnNo && !t.txnNo.includes(q.txnNo.trim())) return false;
    if (q.bizCurrency && t.bizCurrency !== q.bizCurrency) return false;
    if (q.type && t.type !== q.type) return false;
    if (q.timeFrom && t.time < q.timeFrom) return false;
    if (q.timeTo && t.time > q.timeTo + " 23:59:59") return false;
    if (q.relatedNo && !t.relatedNo.includes(q.relatedNo.trim())) return false;
    return true;
  }).slice().sort((a, b) => (a.time < b.time ? 1 : -1));
  const cell = (t, key) => {
    if (key === "biz") return bizTag(t.biz);
    if (key === "txnAmount") return moneyHtml(t.txnAmount);
    if (key === "change") return moneyHtml(t.change, true);
    if (key === "afterAvailable" || key === "afterTotal") return moneyHtml(t[key]);
    if (key === "type" && t.fresh) return `${esc(t.type)} <span class="tag green">新</span>`;
    return esc(t[key]);
  };
  const body = rows.length ? rows.map((t) => `<tr class="${db.highlight.txnId === t.id ? "hit" : ""}">
    ${visible.map(([key]) => `<td>${cell(t, key)}</td>`).join("")}
  </tr>`).join("") : `<tr class="empty"><td colspan="${visible.length}">无交易</td></tr>`;
  const types = [...new Set(db.txns.map((t) => t.type))];
  const bizCurrencies = [...new Set(db.txns.map((t) => t.bizCurrency))];
  const picker = db.colOpen ? `<div class="popover" id="col-picker">${TX_COLS.map(([key, label]) =>
    `<label><input type="checkbox" data-action="toggle-col" data-col="${key}" ${db.txHidden[key] ? "" : "checked"} />${esc(label)}</label>`

      ${field("交易号", textInput("xq-txn", qval("txns", "txnNo"), "交易号"))}

function viewReceipts() {
  const q = db.queries.receipts;
  const channel = db.channel;
  const rows = db.receipts.filter((r) => {
    if (r.channel !== channel) return false;
    if (q.customer && !r.customer.includes(q.customer.trim())) return false;
    if (q.period && !r.period.includes(q.period.trim())) return false;
    if (q.platform && r.platform !== q.platform) return false;
    if (q.billNo && !r.billNo.includes(q.billNo.trim())) return false;
    if (q.start && r.date < q.start) return false;
    if (q.end && r.date.slice(0, 10) > q.end) return false;
    return true;
  });
  const body = rows.length ? rows.map((r) => `<tr>

function submitTransfer() {
  const err = document.getElementById("tf-err");
  const out = accountById(document.getElementById("tf-out").value);
  const inn = accountById(document.getElementById("tf-in").value);
  const amount = round2(document.getElementById("tf-amount").value);
  const rate = Number(document.getElementById("tf-rate").value);
  const reason = document.getElementById("tf-reason").value;
  const file = document.getElementById("tf-file").files[0];
  if (!out || !inn) { err.textContent = "请选择调出和调入账户。"; return; }
  if (out.accountId === inn.accountId) { err.textContent = "调出和调入不能是同一个账户。"; return; }
  const sides = [out.biz, inn.biz];
  const okPair = sides.includes("垫资") && sides.some((biz) => biz === "履约" || biz === "广告");
  if (!okPair) { err.textContent = "垫资账户只能和履约或广告互转。"; return; }
  if (!(amount > 0)) { err.textContent = "请输入大于 0 的调出金额。"; return; }
  if (cents(amount) > cents(out.real)) { err.textContent = "调出金额超过当前余额。通过前余额不会被预占，但提交时不能超过余额。"; return; }
  if (!isFinite(rate) || rate <= 0) { err.textContent = "请填写大于 0 的汇率。"; return; }
  if (!reason) { err.textContent = "请选择调拨原因。"; return; }
  const inAmount = round2(amount * rate);
  const item = {
    id: "t-" + nextNo(""),
    kind: "transfer",
    transferNo: "TRF" + nowText().slice(0, 10).replace(/-/g, "") + nextNo(""),
    approvalNo: "AP" + nowText().slice(0, 10).replace(/-/g, "") + nextNo(""),
    status: "待飞书审批",
    outAccountId: out.accountId,
    inAccountId: inn.accountId,
    outMerchantId: out.merchantId,
    outName: out.name,
    outBiz: out.biz,
    outCurrency: out.currency,
    outAmount: amount,
    outBalanceAfter: out.real,
    inMerchantId: inn.merchantId,
    inName: inn.name,
    inBiz: inn.biz,
    inCurrency: inn.currency,
    inAmount,
    rate,
    reason,
    attachment: file ? file.name : "—",
    operator: "原型操作员",
    createdAt: nowText(),
    auditedAt: "",
    direction: ""
  };
  db.transfers.unshift(item);
  db.highlight.transferId = item.id;
  closeModal();
  render();
  toast("已提交，待飞书审批。通过前不改余额，交易详情和余额表都不变。");
}

function addTxn(account, signed, type, rate, relatedNo, remark) {
  const txn = {
    id: "x-" + nextNo(""),
    merchantId: account.merchantId,
    merchantName: account.name,
    uniqueId: account.uniqueId,
    time: nowText(),
    biz: account.biz,
    bizCurrency: account.biz + account.currency,
    type,
    txnCurrency: account.currency,
    txnAmount: round2(Math.abs(signed)),
    accountCurrency: account.currency,
    change: round2(signed),
    afterAvailable: round2(account.real),
    afterTotal: round2(account.real),
    rate: Number(rate).toFixed(2),
    operator: "原型操作员",
    txnNo: "TX" + nowText().replace(/\D/g, "").slice(0, 14),
    flowNo: "LS" + nowText().replace(/\D/g, "").slice(0, 14),
    relatedNo,
    trace: "飞书审批通过",
    remark,
    fresh: true
  };
  db.txns.unshift(txn);
  db.highlight.txnId = txn.id;
}

function syncBalance(account) {
  if (!account || account.biz !== "垫资") return;
  const rows = db.balances.filter((b) => b.customer === account.name && b.currency === account.currency);
  if (!rows.length) {
    db.syncNote = account.name + " 的垫资余额已改，余额表没有对应周期行。";
    return;
  }
  rows.sort((a, b) => (a.periodEnd < b.periodEnd ? 1 : -1));
  const row = rows[0];
  const before = row.ending;
  row.ending = round2(account.real);
  row.fundBalance = round2(account.real);
  row.synced = true;
  db.highlight.balanceId = row.id;
  db.syncNote = `${row.customer} ${row.period} 的期末已从 ${money(before)} 同步为 ${money(row.ending)}。`;
}

function approve(id) {
  const item = db.transfers.find((t) => t.id === id);
  if (!item || item.status !== "待飞书审批") return;
  if (item.kind === "adjust") {
    const account = accountById(item.outAccountId);
    const signed = item.direction === "减少" ? -item.outAmount : item.outAmount;
    if (cents(account.real + signed) < 0) {
      toast("余额已不够这笔调减，未通过，余额表不变。");
      return;
    }
    account.real = round2(account.real + signed);
    item.outBalanceAfter = account.real;
    item.status = "已通过";
    item.auditedAt = nowText();
    addTxn(account, signed, item.direction === "减少" ? "手动调额-减少" : "手动调额-增加", 1, item.transferNo, item.reason);
    syncBalance(account);
  } else {
    const out = accountById(item.outAccountId);
    const inn = accountById(item.inAccountId);
    if (cents(out.real) < cents(item.outAmount)) {
      toast("调出余额已不够这笔调拨，未通过，余额表不变。");
      return;
    }
    out.real = round2(out.real - item.outAmount);
    inn.real = round2(inn.real + item.inAmount);
    item.outBalanceAfter = out.real;
    item.status = "已通过";
    item.auditedAt = nowText();
    const advance = out.biz === "垫资" ? out : inn;
    const signed = out.biz === "垫资" ? -item.outAmount : item.inAmount;
    const type = out.biz === "垫资" ? "账户调拨-转出" : "账户调拨-转入";
    addTxn(advance, signed, type, item.rate, item.transferNo, item.reason);
    syncBalance(advance);
  }
  db.highlight.transferId = item.id;
  render();
  toast("审批通过。垫资余额已改，交易详情新增一条流水，余额表期末已同步。");
}

function reject(id) {
  const item = db.transfers.find((t) => t.id === id);
  if (!item || item.status !== "待飞书审批") return;
  item.status = "已驳回";
  item.auditedAt = nowText();
  db.highlight.transferId = item.id;
  render();
  toast("已驳回。余额、交易详情、余额表都没有变化。");
}

function transferDetail(id) {
  const t = db.transfers.find((item) => item.id === id);
  if (!t) return;
  const line = (label, value) => `<i>${esc(label)}</i><span>${value}</span>`;
  openModal(`<div class="mask" data-action="mask-close"><div class="modal narrow">
    <h3>调拨详情<button type="button" data-action="close" aria-label="关闭">×</button></h3>
    <div class="body"><div class="kv">
      ${line("调拨单号", esc(t.transferNo))}
      ${line("审批单号", esc(t.approvalNo))}
      ${line("状态", statusTag(t.status))}
      ${line("调出", esc(`${t.outName} / ${t.outBiz} / ${t.outCurrency} ${money(t.outAmount)}`))}
      ${line("调入", t.kind === "adjust" ? "手动调额，无调入账户" : esc(`${t.inName} / ${t.inBiz} / ${t.inCurrency} ${money(t.inAmount)}`))}
      ${line("原因", esc(t.reason))}
      ${line("创建时间", esc(t.createdAt))}
      ${line("审核时间", esc(t.auditedAt || "—"))}
    </div>
    <p class="note">${t.status === "待飞书审批" ? "还没通过，账户余额和余额表期末都还是原数。" : "已结束的单据不会再次改余额。"}</p>
    </div>
    <div class="footer">
      ${t.status === "待飞书审批" ? `<button class="btn primary" type="button" data-action="approve" data-id="${esc(t.id)}">审批通过</button>` : ""}
      <button class="btn" type="button" data-action="close">关闭</button>
    </div>
  </div></div>`);
}

function accountDetail(id) {
  const m = accountById(id);
  if (!m) return;
  const line = (label, value) => `<i>${esc(label)}</i><span>${value}</span>`;
  openModal(`<div class="mask" data-action="mask-close"><div class="modal narrow">
    <h3>商户账户<button type="button" data-action="close" aria-label="关闭">×</button></h3>
    <div class="body"><div class="kv">
      ${line("商户", esc(m.merchantId + " " + m.name))}
      ${line("子业务", bizTag(m.biz))}
      ${line("资金账户", esc(m.accountId))}
      ${line("币种", esc(m.currency))}
      ${line("真实资金", moneyCcy(m.real, m.currency))}
      ${line("资金状态", esc(m.fundStatus))}
    </div></div>
    <div class="footer"><button class="btn" type="button" data-action="close">关闭</button></div>
  </div></div>`);
}

function exportTxns() {
  const visible = TX_COLS.filter(([key]) => !db.txHidden[key]);
  const lines = [visible.map(([, label]) => label).join(",")];
  db.txns.forEach((t) => {
    lines.push(visible.map(([key]) => `"${String(t[key] ?? "").replace(/"/g, '""')}"`).join(","));
  });
  const blob = new Blob(["\ufeff" + lines.join("\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "交易详情.csv";
  a.click();
  URL.revokeObjectURL(a.href);
}

document.body.addEventListener("click", (event) => {
  const goEl = event.target.closest("[data-go]");
  if (goEl) { go(goEl.dataset.go); return; }
  const el = event.target.closest("[data-action]");
  if (!el) return;
  const action = el.dataset.action;
  if (action === "mask-close" && event.target !== el) return;
  if (action === "close" || action === "mask-close") { closeModal(); return; }
  if (action === "open-transfer") { openTransfer(); return; }
  if (action === "open-adjust") { openAdjust(el.dataset.id || ""); return; }
  if (action === "approve") { closeModal(); approve(el.dataset.id); return; }
  if (action === "reject") { reject(el.dataset.id); return; }
  if (action === "transfer-detail") { transferDetail(el.dataset.id); return; }
  if (action === "account-detail") { accountDetail(el.dataset.id); return; }
  if (action === "channel") { db.channel = el.dataset.channel; render(); return; }
  if (action === "toggle-cols") { db.colOpen = !db.colOpen; render(); return; }
  if (action === "export-txns") { exportTxns(); return; }
  if (action === "reset-demo") {
    const stay = page();
    db = seed();
    closeModal();
    if (location.hash !== "#" + stay) location.hash = stay;
    else render();
    toast("已恢复示例数据。");
    return;
  }
  if (action === "search-merchants") {
    db.queries.merchants = readForm([
      ["mq-id", "id"], ["mq-name", "name"], ["mq-uid", "uniqueId"], ["mq-erp", "erp"],
      ["mq-acc", "accountId"], ["mq-fund", "fundStatus"], ["mq-ccy", "currency"],
      ["mq-biz", "biz"], ["mq-manager", "manager"], ["mq-clerk", "clerk"]
    ]);
    render();
    return;
  }
  if (action === "reset-merchants") { db.queries.merchants = {}; render(); return; }
  if (action === "search-transfers") {
    db.queries.transfers = readForm([
      ["tq-no", "transferNo"], ["tq-ap", "approvalNo"], ["tq-st", "status"],
      ["tq-out-mid", "outMerchantId"], ["tq-in-mid", "inMerchantId"],
      ["tq-out-biz", "outBiz"], ["tq-in-biz", "inBiz"],
      ["tq-out-ccy", "outCurrency"], ["tq-in-ccy", "inCurrency"],
      ["tq-min", "amountMin"], ["tq-max", "amountMax"]
    ]);
    render();
    return;
  }
  if (action === "reset-transfers") { db.queries.transfers = {}; render(); return; }
  if (action === "search-txns") {
    db.queries.txns = readForm([
      ["xq-id", "merchantId"], ["xq-name", "merchantName"], ["xq-uid", "uniqueId"],
      ["xq-flow", "flowNo"], ["xq-txn", "txnNo"], ["xq-bizc", "bizCurrency"],
      ["xq-type", "type"], ["xq-from", "timeFrom"], ["xq-to", "timeTo"], ["xq-rel", "relatedNo"]
    ]);
    db.colOpen = false;
    render();
    return;
  }
  if (action === "reset-txns") { db.queries.txns = {}; db.colOpen = false; render(); return; }
  if (action === "search-receipts") {
    db.queries.receipts = readForm([
      ["rq-customer", "customer"], ["rq-period", "period"], ["rq-platform", "platform"],
      ["rq-bill", "billNo"], ["rq-start", "start"], ["rq-end", "end"], ["rq-tz", "timezone"]
    ]);
    if (db.queries.receipts.platform) db.channel = db.queries.receipts.platform;
    render();
    return;
  }
  if (action === "reset-receipts") { db.queries.receipts = {}; render(); return; }
  if (action === "search-balance") {
    db.queries.balance = readForm([["bq-customer", "customer"], ["bq-period", "period"]]);
    render();
    return;
  }
  if (action === "reset-balance") { db.queries.balance = {}; render(); return; }
});

document.body.addEventListener("change", (event) => {
  const el = event.target.closest("[data-action=toggle-col]");
  if (!el) return;
  db.txHidden[el.dataset.col] = !el.checked;
  render();
});

window.addEventListener("hashchange", render);
if (!location.hash) location.hash = "fund-merchants";
else render();
</script>
</body>
</html>
